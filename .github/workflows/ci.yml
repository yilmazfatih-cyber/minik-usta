name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run levels:validate

  # CL-V3C-07: the cached levels:check is not independent evidence; recompute without the cache when levels, the solver
  # or the core change (about 11 minutes with 4 jobs).
  levels-nocache:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # full history: a push of several commits diffs against `before`, which a shallow clone may not hold
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base="HEAD~1"; fi
          # fail safe: an unknown base (force push, missing object) runs the job instead of skipping it
          if ! files="$(git diff --name-only "$base" HEAD -- levels tools/solver src/core tools/solve.ts)"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$files" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.run == 'true' || github.event_name == 'pull_request'
        with:
          node-version: 22
          cache: npm
      - if: steps.changed.outputs.run == 'true' || github.event_name == 'pull_request'
        run: npm ci
      - if: steps.changed.outputs.run == 'true' || github.event_name == 'pull_request'
        run: node tools/solve.ts --check --no-cache --jobs 4
